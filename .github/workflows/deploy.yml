name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Diagnose PWA chunk 5
        run: |
          python3 - <<'PY'
          import base64,re
          data=open('pwa-src/index.b64.part05','r',encoding='utf-8').read()
          data=re.sub(r'[^A-Za-z0-9+/=]','',data)
          for i,(a,b) in enumerate([(0,16000),(16000,32000)],1):
              seg=data[a:b]
              seg += '='*((4-len(seg)%4)%4)
              raw=base64.b64decode(seg,validate=False)
              print('SEG',i,'len',len(raw))
              print('START',repr(raw[:220]))
              print('END',repr(raw[-220:]))
          PY

      - name: Build Gelo Tutoia PWA
        run: |
          exit 1

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler@latest deploy
