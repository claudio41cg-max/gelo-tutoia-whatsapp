name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build Gelo Tutoia PWA
        run: |
          mkdir -p public/app
          cat pwa-src/index.b64.part* | tr -d '\n\r' | base64 --decode > public/app/index.html
          sed -i 's#\./icon-192\.png#./icon.svg#g; s#\./icon-512\.png#./icon.svg#g' public/app/index.html

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler@latest deploy
